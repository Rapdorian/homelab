# Shared Traefik Middlewares, in the `default` namespace so any namespace can
# reference them (cross-namespace references are enabled on the k3s Traefik via
# infrastructure/traefik/helmchartconfig.yaml).
#
# Reference them from an Ingress with:
#   traefik.ingress.kubernetes.io/router.middlewares: default-security-headers@kubernetescrd
#   traefik.ingress.kubernetes.io/router.middlewares: default-authentik-forwardauth@kubernetescrd
#
# `authentik-forwardauth` delegates to Authentik's embedded outpost, which maps
# the request Host to a proxy provider/application and enforces Authentik RBAC.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: default
spec:
  forwardAuth:
    address: http://authentik-server.auth.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: default
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    customRequestHeaders:
      X-Forwarded-Proto: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
