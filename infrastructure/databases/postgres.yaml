# Shared PostgreSQL. Credentials come from the SOPS-encrypted `postgres-auth`
# Secret (keys `postgres-password` for the superuser, `authentik-password` for
# the Authentik role).
#
# The initdb script runs once on first boot. It creates a login role per app and
# reads that role's password from an environment variable (populated from the
# Secret via `extraEnvVars`), so no secret is embedded in the script or state.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: databases
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: postgresql
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    fullnameOverride: postgres
    auth:
      existingSecret: postgres-auth
      enablePostgresUser: true
    primary:
      persistence:
        storageClass: local-path
        size: 10Gi
      extraEnvVars:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: postgres-password
        - name: AUTHENTIK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-auth
              key: authentik-password
      initdb:
        scripts:
          01-authentik.sh: |
            #!/bin/bash
            set -e
            if ! psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='authentik'" | grep -q 1; then
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
                -c "CREATE ROLE authentik LOGIN PASSWORD '$AUTHENTIK_PASSWORD';"
            fi
            if ! psql -U postgres -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='authentik'" | grep -q 1; then
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
                -c "CREATE DATABASE authentik OWNER authentik;"
            fi
