# Let's Encrypt via the Cloudflare DNS-01 solver.
#
# cert-manager creates/removes the `_acme-challenge` TXT records through the
# Cloudflare API, so certificates can be issued for hosts that resolve to a
# private IP (no inbound reachability required). This is what makes `.dev`
# hosts work, since `.dev` is HSTS-preloaded and requires a publicly trusted
# certificate.
#
# The credentials Secret `cloudflare-api-token` (key `api-token`) must live in
# the cert-manager namespace (its cluster-resource namespace) and hold a
# Cloudflare API token scoped to `Zone -> DNS -> Edit` for jpruitt.dev.
# The ClusterIssuer applies fine without it and becomes Ready once it exists.
#
# To test against staging first, point an Ingress/Certificate at
# `letsencrypt-staging` (avoids burning the production rate limit).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: admin@jpruitt.dev
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    email: admin@jpruitt.dev
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
