# Declarative Authentik configuration (blueprints).
#
# Every key ending in `.yaml` is discovered and applied by the Authentik
# blueprint loader. The ConfigMap is mounted by setting `blueprints.configMaps`
# in the Authentik HelmRelease.
#
# The Grafana OIDC client_secret is injected from the environment with `!Env`
# (see global.env in helmrelease.yaml), so no secret is committed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
data:
  # ---------------------------------------------------------------------------
  # Grafana: OIDC login + Authentik-group-driven Grafana roles.
  #
  # Membership of the groups below is what controls access & permissions:
  #   Grafana Admins  -> Grafana Admin
  #   Grafana Editors -> Grafana Editor
  #   Grafana Viewers -> Grafana Viewer
  # Grafana maps the `groups` claim to a role via role_attribute_path
  # (see infrastructure/observability/kube-prometheus-stack.yaml).
  # ---------------------------------------------------------------------------
  10-grafana-oidc.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: grafana-oidc
      labels:
        blueprints.goauthentik.io/description: Grafana OIDC + group-based RBAC
    entries:
      - model: authentik_core.group
        id: group-grafana-admins
        identifiers:
          name: Grafana Admins
        attrs: {}
      - model: authentik_core.group
        id: group-grafana-editors
        identifiers:
          name: Grafana Editors
        attrs: {}
      - model: authentik_core.group
        id: group-grafana-viewers
        identifiers:
          name: Grafana Viewers
        attrs: {}
      - model: authentik_providers_oauth2.scopemapping
        id: scope-groups
        identifiers:
          name: Grafana Groups
        attrs:
          scope_name: groups
          description: Adds the user's Authentik groups as a `groups` claim.
          expression: |
            return {"groups": [group.name for group in request.user.ak_groups.all()]}
      - model: authentik_providers_oauth2.oauth2provider
        id: provider-grafana
        identifiers:
          name: Grafana
        attrs:
          client_type: confidential
          client_id: grafana
          client_secret: !Env GRAFANA_OAUTH_CLIENT_SECRET
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          redirect_uris:
            - matching_mode: strict
              url: https://grafana.local.jpruitt.dev/login/generic_oauth
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, email]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, offline_access]]
            - !KeyOf scope-groups
      - model: authentik_core.application
        id: app-grafana
        identifiers:
          slug: grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider-grafana
          meta_launch_url: https://grafana.local.jpruitt.dev
          meta_description: Grafana SSO (OIDC) via Authentik
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-grafana
          group: !KeyOf group-grafana-admins
        attrs:
          order: 10
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-grafana
          group: !KeyOf group-grafana-editors
        attrs:
          order: 20
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-grafana
          group: !KeyOf group-grafana-viewers
        attrs:
          order: 30

  # ---------------------------------------------------------------------------
  # Forward-auth for services without native OIDC.
  #
  # Pattern: one proxy provider (mode forward_single) + application per
  # protected host, plus group bindings for access control. The shared Traefik
  # `authentik-forwardauth` Middleware points at the embedded outpost, which
  # matches the incoming Host to the provider's external_host.
  #
  # Example below protects https://hello.local.jpruitt.dev for members of
  # `Internal Users`.
  # ---------------------------------------------------------------------------
  20-forwardauth.yaml: |
    # yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
    version: 1
    metadata:
      name: forward-auth-apps
      labels:
        blueprints.goauthentik.io/description: Forward-auth proxy providers per app
    entries:
      - model: authentik_core.group
        id: group-internal-users
        identifiers:
          name: Internal Users
        attrs: {}
      - model: authentik_providers_proxy.proxyprovider
        id: provider-hello
        identifiers:
          name: hello
        attrs:
          mode: forward_single
          external_host: https://hello.local.jpruitt.dev
          cookie_domain: local.jpruitt.dev
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      - model: authentik_core.application
        id: app-hello
        identifiers:
          slug: hello
        attrs:
          name: Hello World
          provider: !KeyOf proxy-hello
          meta_launch_url: https://hello.local.jpruitt.dev
          meta_description: Forward-auth protected example app
      - model: authentik_policies.policybinding
        identifiers:
          target: !KeyOf app-hello
          group: !KeyOf group-internal-users
        attrs:
          order: 10
