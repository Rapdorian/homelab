# acme-dns config.toml. Replace `acme-dns.jpruitt.dev` with the public DNS name
# you delegate to this server and set `records` to the A/AAAA of the DNS
# Service's external IP (`kubectl get svc -n acme-dns acme-dns-dns`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: acme-dns-config
  namespace: acme-dns
data:
  config.toml: |
    [general]
    listen = "0.0.0.0:53"
    protocol = "both"
    domain = "acme-dns.jpruitt.dev"
    nsname = "acme-dns.jpruitt.dev"
    nsadmin = "admin.jpruitt.dev"
    records = [
      "acme-dns.jpruitt.dev. A 127.0.0.1",
      # "acme-dns.jpruitt.dev. AAAA ::1",
    ]
    debug = false

    [database]
    engine = "sqlite3"
    connection = "/var/lib/acme-dns/acme-dns.db"

    [api]
    ip = "0.0.0.0"
    port = "8080"
    tls = "none"
    # Set to "true" once all your certificate domains are registered.
    disable_registration = "false"

    [logconfig]
    loglevel = "info"
    logformat = "text"
