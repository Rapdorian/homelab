---
apiVersion: v1
kind: Service
metadata:
  name: acme-dns-api
  namespace: acme-dns
spec:
  type: ClusterIP
  selector:
    app: acme-dns
  ports:
    - name: api
      port: 8080
      targetPort: api
---
apiVersion: v1
kind: Service
metadata:
  name: acme-dns-dns
  namespace: acme-dns
spec:
  type: LoadBalancer
  selector:
    app: acme-dns
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
