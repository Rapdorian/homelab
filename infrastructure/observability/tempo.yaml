# Tempo (traces), local filesystem backend, OTLP receivers enabled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: tempo
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
      receivers:
        otlp:
          protocols:
            grpc: {}
            http: {}
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
