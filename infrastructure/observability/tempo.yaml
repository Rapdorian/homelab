# Tempo (traces), local filesystem backend, OTLP receivers enabled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: tempo
      # Pinned: Tempo >=2.7 images require an x86-64-v2 CPU. This node is a VM
      # whose guest CPU lacks v2 (only ssse3 is exposed). Revisit once the VM
      # CPU type is set to `host`/`x86-64-v2` on the hypervisor.
      version: "1.17.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    tempo:
      storage:
        trace:
          backend: local
          local:
            path: /var/tempo/traces
      receivers:
        otlp:
          protocols:
            grpc: {}
            http: {}
    persistence:
      enabled: true
      storageClassName: local-path
      size: 10Gi
