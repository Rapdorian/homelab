# Example app, protected by Authentik forward-auth.
#
# Access is controlled in Authentik: the matching proxy provider + application
# (see infrastructure/auth/blueprints-configmap.yaml) is external_host
# https://hello.local.jpruitt.dev, bound to the `Internal Users` group. Only
# members of that group can reach this Service.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: hello-world
          image: paulbouwer/hello-kubernetes:1.10
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hello-world
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-authentik-forwardauth@kubernetescrd,default-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: hello.local.jpruitt.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  number: 80
  tls:
    - secretName: wildcard-local-tls
      hosts:
        - hello.local.jpruitt.dev
