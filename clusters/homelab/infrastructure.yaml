# Reconciles everything under ./infrastructure: sources, namespaces,
# cert-manager (Cloudflare DNS-01 + wildcard cert), Reflector, Traefik tuning,
# databases, Authentik, observability and networking.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 15m
  path: ./infrastructure
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
    - name: sources
    - name: secrets
    - name: cert-manager
